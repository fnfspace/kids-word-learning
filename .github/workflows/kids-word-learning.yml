name: Kids Word Learning Scheduler

on:
  schedule:
    # UTC 기준 → KST 오전 5시47분(복습)/오전 11시47분(신규), 정각 지연 회피 위해 분 단위 오프셋 사용
    - cron: '47 20 * * *'   # 오전 5시47분 (복습)
    - cron: '47 2 * * *'    # 오전 11시47분 (신규 학습)

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Determine slot from trigger time
        id: slot
        run: |
          case "${{ github.event.schedule }}" in
            '47 20 * * *') echo "slot=review_words" >> "$GITHUB_OUTPUT" ;;
            '47 2 * * *') echo "slot=new_words" >> "$GITHUB_OUTPUT" ;;
            *) echo "slot=all" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Send Telegram Message
        run: python script/telegram_send_v1.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLOT: ${{ steps.slot.outputs.slot }}
